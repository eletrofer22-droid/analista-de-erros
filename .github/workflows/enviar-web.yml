name: Enviar versão web
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Endereço de envio (temporário)"
        required: true
jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar arquivo
        env:
          DESTINO: ${{ inputs.url }}
        run: |
          ls -l web/analista-de-erros.html
          curl -fsS -X PUT -H 'Content-Type: text/plain' --data-binary @web/analista-de-erros.html "$DESTINO" -o /dev/null -w "HTTP %{http_code}\n"
