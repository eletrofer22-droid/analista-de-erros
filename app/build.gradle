plugins {
    id 'com.android.application'
}

android {
    namespace 'com.analistadeerros.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.analistadeerros.app'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.7-teste'
    }

    // Mesma assinatura em todas as versões de teste, para atualizar por cima sem desinstalar
    signingConfigs {
        teste {
            storeFile file('teste.keystore')
            storePassword 'analista123'
            keyAlias 'teste'
            keyPassword 'analista123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.teste
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
